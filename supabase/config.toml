# Supabase config — MÍNIMO (este repo no tenía config.toml; solo declaramos las Edge
# Functions de la economía). El resto de secciones usan defaults del CLI. ⚠️ Si existe un
# config.toml más completo generado en otro entorno, reconciliar. Ver COWORK_REPORT.

[functions.award-electrons]
verify_jwt = true

[functions.settle-challenge]
verify_jwt = true

# MB-4 (fix B1): la protección real es getUser() dentro de la función (la anon key
# ES un JWT válido y pasaría verify_jwt); esto solo corta requests sin JWT alguno.
[functions.argos-voice]
verify_jwt = true

# MB-13: webhooks de pago. Los proveedores NO mandan JWT de Supabase; la
# protección real es la firma (Stripe HMAC) / token compartido (Conekta,
# RevenueCat) dentro de cada función.
[functions.payment-webhook]
verify_jwt = false

[functions.revenuecat-webhook]
verify_jwt = false
