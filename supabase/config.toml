# Supabase config — MÍNIMO (este repo no tenía config.toml; solo declaramos las Edge
# Functions de la economía). El resto de secciones usan defaults del CLI. ⚠️ Si existe un
# config.toml más completo generado en otro entorno, reconciliar. Ver COWORK_REPORT.

[functions.award-electrons]
verify_jwt = true

[functions.settle-challenge]
verify_jwt = true

# MB-4 (fix B1): la protección real es getUser() dentro de la función (la anon key
# ES un JWT válido y pasaría verify_jwt); esto solo corta requests sin JWT alguno.
[functions.argos-voice]
verify_jwt = true

# SEG-1: mismo caso que argos-voice. Este renglón NO autentica a nadie (la anon
# key pasa el gate); solo se declara para que quede escrito que la identidad se
# resuelve adentro, con resolverIdentidad() de _shared/identidad.ts.
# El interruptor del cierre definitivo NO vive aquí, vive en una env var:
#   npx supabase secrets set ARGOS_EXIGE_JWT=true    (cerrar)
#   npx supabase secrets unset ARGOS_EXIGE_JWT       (volver a la gracia)
# No prender hasta que el OTA con ARGOS_MANDA_JWT_DEL_USUARIO haya llegado a todos.
[functions.argos-proxy]
verify_jwt = true

# MB-13: webhooks de pago. Los proveedores NO mandan JWT de Supabase; la
# protección real es la firma (Stripe HMAC) / token compartido (Conekta,
# RevenueCat) dentro de cada función.
[functions.payment-webhook]
verify_jwt = false

[functions.revenuecat-webhook]
verify_jwt = false

# MB-13 · Pieza 6.4: reclamo de consumibles — requiere JWT de usuario; la
# verificación real es getUser() adentro + idempotencia por transaction_id.
[functions.reclaim-hplus]
verify_jwt = true
